<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Sheet — Image Gallery</title>
<style>
  :root{
    --ink:#161513;
    --paper:#efe9df;
    --amber:#d98e2b;
    --sage:#6f7a5f;
    --line:#3a3733;
    --grey:#8b8578;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Courier New', Courier, monospace;
    min-height:100vh;
  }
  .frame{
    max-width:1200px;
    margin:0 auto;
    padding:32px 20px 80px;
  }
  header{
    display:flex;
    flex-direction:column;
    gap:6px;
    border-bottom:2px dashed var(--grey);
    padding-bottom:24px;
    margin-bottom:28px;
  }
  .roll-label{
    font-size:12px;
    letter-spacing:.28em;
    color:var(--amber);
    text-transform:uppercase;
  }
  h1{
    font-family:Georgia, 'Times New Roman', serif;
    font-weight:700;
    font-size:clamp(32px,6vw,56px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--grey);
    font-size:14px;
    max-width:520px;
    line-height:1.5;
  }

  /* Filter reel */
  .filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:28px;
  }
  .filters button{
    background:transparent;
    border:1px solid var(--grey);
    color:var(--paper);
    font-family:inherit;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:8px 16px;
    border-radius:20px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .filters button:hover{border-color:var(--amber); color:var(--amber);}
  .filters button.active{
    background:var(--amber);
    border-color:var(--amber);
    color:var(--ink);
    font-weight:700;
  }

  /* Contact sheet grid */
  .sheet{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:4px;
    background:var(--line);
    padding:4px;
    border-radius:4px;
  }
  .frame-cell{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    background:#000;
    cursor:pointer;
    opacity:0;
    animation:fadeIn .5s ease forwards;
  }
  .frame-cell img{
    width:100%;height:100%;
    object-fit:cover;
    filter:grayscale(65%) contrast(1.05);
    transition:transform .5s ease, filter .4s ease;
    display:block;
  }
  .frame-cell:hover img{
    transform:scale(1.08);
    filter:grayscale(0%) contrast(1.05);
  }
  .frame-cell .tag{
    position:absolute;
    top:8px; left:8px;
    font-size:10px;
    letter-spacing:.1em;
    background:rgba(0,0,0,.55);
    color:var(--amber);
    padding:3px 7px;
    text-transform:uppercase;
  }
  .frame-cell .num{
    position:absolute;
    bottom:8px; right:10px;
    font-size:11px;
    color:rgba(255,255,255,.75);
  }
  @keyframes fadeIn{ to{ opacity:1; } }

  /* Lightbox */
  .lightbox{
    position:fixed; inset:0;
    background:rgba(10,9,8,.96);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    flex-direction:column;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:min(88vw,900px);
    max-height:68vh;
    object-fit:contain;
    border:2px solid var(--paper);
  }
  .lightbox .caption{
    margin-top:14px;
    color:var(--paper);
    font-size:13px;
    letter-spacing:.05em;
    text-align:center;
  }
  .lightbox .caption .cat{color:var(--amber); text-transform:uppercase; font-size:11px; letter-spacing:.15em;}
  .lb-controls{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px;
    pointer-events:none;
  }
  .lb-controls button{
    pointer-events:auto;
    background:none;
    border:1px solid var(--grey);
    color:var(--paper);
    font-size:22px;
    width:48px;height:48px;
    border-radius:50%;
    cursor:pointer;
  }
  .lb-controls button:hover{border-color:var(--amber); color:var(--amber);}
  .lb-close{
    position:absolute;
    top:22px; right:24px;
    background:none;
    border:none;
    color:var(--paper);
    font-size:28px;
    cursor:pointer;
    line-height:1;
  }
  .lb-close:hover{color:var(--amber);}
  .lb-index{
    position:absolute;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    color:var(--grey);
    letter-spacing:.15em;
  }

  footer{
    margin-top:40px;
    text-align:center;
    font-size:11px;
    color:var(--grey);
    letter-spacing:.1em;
  }
</style>
</head>
<body>

<div class="frame">
  <header>
    <span class="roll-label">Roll 04 · Developed 2026</span>
    <h1>Contact Sheet</h1>
    <p class="sub">A working gallery of frames sorted by category. Click any frame to open it full size, then use the arrows or your keyboard to move through the roll.</p>
  </header>

  <nav class="filters" id="filters"></nav>

  <section class="sheet" id="sheet"></section>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <img id="lbImage" src="" alt="">
  <div class="caption">
    <div class="cat" id="lbCat"></div>
    <div id="lbTitle"></div>
  </div>
  <div class="lb-controls">
    <button id="lbPrev" aria-label="Previous">&#8592;</button>
    <button id="lbNext" aria-label="Next">&#8594;</button>
  </div>
  <div class="lb-index" id="lbIndex"></div>
</div>

<footer>CodeAlpha Frontend Task 1 — Image Gallery</footer>

<script>
const photos = [
  { cat:"Landscape", title:"Ridge Line, Dawn", src:"https://picsum.photos/id/1015/900/900" },
  { cat:"Landscape", title:"Fjord Water", src:"https://picsum.photos/id/1016/900/900" },
  { cat:"Portrait", title:"Study in Grey", src:"https://picsum.photos/id/1027/900/900" },
  { cat:"Urban", title:"Concrete Grid", src:"https://picsum.photos/id/1031/900/900" },
  { cat:"Urban", title:"Night Traffic", src:"https://picsum.photos/id/1035/900/900" },
  { cat:"Nature", title:"Forest Floor", src:"https://picsum.photos/id/1043/900/900" },
  { cat:"Nature", title:"Still Water", src:"https://picsum.photos/id/1053/900/900" },
  { cat:"Portrait", title:"Window Light", src:"https://picsum.photos/id/1062/900/900" },
  { cat:"Landscape", title:"Desert Road", src:"https://picsum.photos/id/1074/900/900" },
  { cat:"Urban", title:"Stairwell", src:"https://picsum.photos/id/1084/900/900" },
  { cat:"Nature", title:"Canopy", src:"https://picsum.photos/id/1080/900/900" },
  { cat:"Portrait", title:"Quiet Profile", src:"https://picsum.photos/id/1005/900/900" },
];

const sheet = document.getElementById('sheet');
const filtersEl = document.getElementById('filters');
const categories = ["All", ...new Set(photos.map(p=>p.cat))];
let activeCat = "All";
let currentIndex = 0;
let visible = [];

function renderFilters(){
  filtersEl.innerHTML = categories.map(c =>
    `<button data-cat="${c}" class="${c===activeCat?'active':''}">${c}</button>`
  ).join('');
  filtersEl.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCat = btn.dataset.cat;
      renderFilters();
      renderSheet();
    });
  });
}

function renderSheet(){
  visible = activeCat === "All" ? photos : photos.filter(p=>p.cat===activeCat);
  sheet.innerHTML = visible.map((p,i) => `
    <div class="frame-cell" data-index="${i}" style="animation-delay:${i*0.03}s">
      <span class="tag">${p.cat}</span>
      <img src="${p.src}" alt="${p.title}" loading="lazy">
      <span class="num">${String(i+1).padStart(2,'0')}</span>
    </div>
  `).join('');
  sheet.querySelectorAll('.frame-cell').forEach(cell=>{
    cell.addEventListener('click', ()=> openLightbox(parseInt(cell.dataset.index)));
  });
}

const lightbox = document.getElementById('lightbox');
const lbImage = document.getElementById('lbImage');
const lbCat = document.getElementById('lbCat');
const lbTitle = document.getElementById('lbTitle');
const lbIndex = document.getElementById('lbIndex');

function openLightbox(i){
  currentIndex = i;
  updateLightbox();
  lightbox.classList.add('open');
}
function updateLightbox(){
  const p = visible[currentIndex];
  lbImage.src = p.src.replace('/900/900','/1200/1200');
  lbImage.alt = p.title;
  lbCat.textContent = p.cat;
  lbTitle.textContent = p.title;
  lbIndex.textContent = `${currentIndex+1} / ${visible.length}`;
}
function closeLightbox(){ lightbox.classList.remove('open'); }
function nextImage(){ currentIndex = (currentIndex+1) % visible.length; updateLightbox(); }
function prevImage(){ currentIndex = (currentIndex-1+visible.length) % visible.length; updateLightbox(); }

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbNext').addEventListener('click', nextImage);
document.getElementById('lbPrev').addEventListener('click', prevImage);
lightbox.addEventListener('click', (e)=>{ if(e.target === lightbox) closeLightbox(); });

document.addEventListener('keydown', (e)=>{
  if(!lightbox.classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowRight') nextImage();
  if(e.key === 'ArrowLeft') prevImage();
});

renderFilters();
renderSheet();
</script>

</body>
</html>
